<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photography — Asad Jaleel</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf7f2;
    --ink:#201e1a;
    --grey:#726c62;
    --grey-light:#d8d3c7;
    --photo:#b35b28;
    --ease: cubic-bezier(.65,0,.35,1);
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html{ scroll-behavior:smooth; }

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
  }

  a{ color:inherit; text-decoration:none; }

  /* Topbar */
  .topbar{
    position:sticky;
    top:0; left:0; right:0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:24px 36px;
    z-index:30;
    background:rgba(250,247,242,0.85);
    backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(32,30,26,0.12);
  }
  .back-link{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--grey);
    transition:color 250ms var(--ease);
  }
  .back-link:hover{ color:var(--ink); }
  .back-link svg{ width:14px; height:14px; }

  .brand-mark{
    display:flex;
    opacity:0.85;
    transition:opacity 250ms var(--ease);
  }
  .brand-mark:hover{ opacity:1; }
  .brand-mark img{ display:block; border-radius:8px; }

  /* Hero */
  .hero{
    padding:90px 36px 56px;
    max-width:1200px;
    margin:0 auto;
  }
  .hero h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:clamp(40px, 7vw, 84px);
    line-height:0.98;
    color:var(--ink);
  }

  /* Filters */
  .filters{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    padding:0 36px 48px;
    max-width:1200px;
    margin:0 auto;
  }
  .filter-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    width:42px; height:42px;
    color:var(--grey);
    background:transparent;
    border:1px solid rgba(32,30,26,0.14);
    border-radius:50%;
    cursor:pointer;
    transition:all 300ms var(--ease);
  }
  .filter-btn svg{ width:18px; height:18px; }
  .filter-btn:hover{
    border-color:rgba(32,30,26,0.35);
    color:var(--ink);
  }
  .filter-btn.active{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--bg);
  }

  /* Grid */
  .gallery-wrap{
    padding:0 36px 120px;
    max-width:1200px;
    margin:0 auto;
  }
  .gallery{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:28px;
  }
  @media (max-width: 900px){
    .gallery{ grid-template-columns:repeat(2, 1fr); gap:18px; }
  }
  @media (max-width: 560px){
    .gallery{ grid-template-columns:1fr; }
  }

  .tile{
    position:relative;
    aspect-ratio:4/3;
    overflow:hidden;
    cursor:pointer;
    background:#efece4;
    transition:opacity 450ms var(--ease), filter 450ms var(--ease);
  }
  .tile.hidden{ display:none; }

  /* When the grid has an active hover, everything except the hovered tile dims */
  .gallery.has-hover .tile{
    opacity:0.28;
    filter:grayscale(60%);
  }
  .gallery.has-hover .tile.is-hovered{
    opacity:0;
  }

  .tile img{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    object-position:center;
    transition:transform 600ms var(--ease);
  }
  .tile:hover img{ transform:scale(1.03); }

  /* Empty state */
  .empty-state{
    display:none;
    grid-column:1 / -1;
    padding:100px 20px;
    text-align:center;
    color:var(--grey-light);
  }
  .empty-state svg{ width:32px; height:32px; }
  .empty-state.visible{ display:flex; justify-content:center; }

  /* Scrim behind the floating hover preview */
  .scrim{
    position:fixed; inset:0;
    z-index:40;
    background:rgba(20,23,28,0.82);
    opacity:0;
    pointer-events:none;
    transition:opacity 350ms var(--ease);
  }
  .scrim.active{ opacity:1; }

  /* Floating centered hover preview (desktop, ephemeral, no chrome) */
  .hover-preview{
    position:fixed;
    top:50%; left:50%;
    transform:translate(-50%, -50%) scale(0.92);
    z-index:50;
    opacity:0;
    pointer-events:none;
    transition:opacity 350ms var(--ease), transform 350ms var(--ease);
  }
  .hover-preview.active{
    opacity:1;
    transform:translate(-50%, -50%) scale(1);
  }
  .hover-preview img{
    max-width:78vw;
    max-height:80vh;
    object-fit:contain;
    box-shadow:0 40px 100px rgba(0,0,0,0.45);
    border-radius:2px;
  }

  /* Full lightbox (click to pin open, with nav) */
  .lightbox{
    position:fixed; inset:0;
    z-index:100;
    background:rgba(10,11,14,0.97);
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    transition:opacity 350ms var(--ease);
  }
  .lightbox.open{ opacity:1; pointer-events:auto; }
  .lightbox img{
    max-width:88vw;
    max-height:82vh;
    object-fit:contain;
    border-radius:2px;
    box-shadow:0 30px 80px rgba(0,0,0,0.5);
    transform:scale(0.97);
    transition:transform 350ms var(--ease);
  }
  .lightbox.open img{ transform:scale(1); }

  .lb-close, .lb-prev, .lb-next{
    position:absolute;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.16);
    color:#fff;
    width:44px; height:44px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:background 250ms var(--ease);
  }
  .lb-close:hover, .lb-prev:hover, .lb-next:hover{ background:rgba(255,255,255,0.18); }
  .lb-close{ top:28px; right:28px; }
  .lb-prev{ left:28px; top:50%; transform:translateY(-50%); }
  .lb-next{ right:28px; top:50%; transform:translateY(-50%); }
  .lb-close svg, .lb-prev svg, .lb-next svg{ width:18px; height:18px; }

  .lb-counter{
    position:absolute;
    bottom:28px; left:50%;
    transform:translateX(-50%);
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:0.08em;
    color:rgba(255,255,255,0.6);
  }

  @media (max-width: 640px){
    .lb-prev{ left:12px; }
    .lb-next{ right:12px; }
    .lb-close{ top:16px; right:16px; }
    .lb-close, .lb-prev, .lb-next{ width:38px; height:38px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>

  <div class="topbar">
    <a class="back-link" href="/" aria-label="Home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
    </a>
    <a class="brand-mark" href="/" aria-label="Asad Jaleel">
      <img src="favicon.svg" alt="" width="30" height="30">
    </a>
  </div>

  <section class="hero">
    <h1>Photography</h1>
  </section>

  <div class="filters" id="filters">
    <button class="filter-btn active" data-filter="all" aria-label="All">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    </button>
    <button class="filter-btn" data-filter="portraits" aria-label="Portraits">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
    </button>
    <button class="filter-btn" data-filter="landscapes" aria-label="Landscapes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 18l6-8 4 5 3-4 5 7z"/><circle cx="17" cy="6" r="2"/></svg>
    </button>
    <button class="filter-btn" data-filter="street" aria-label="Street">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 21l5-18h6l5 18M9 9h6M8 15h8"/></svg>
    </button>
  </div>

  <div class="gallery-wrap">
    <main class="gallery" id="gallery">
      <!-- Tiles are injected by JS from the photos[] array below -->
      <div class="empty-state" id="emptyState">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 16l5-5 4 4 5-6 4 5"/></svg>
      </div>
    </main>
  </div>

  <div class="scrim" id="scrim"></div>
  <div class="hover-preview" id="hoverPreview">
    <img id="hoverImg" src="" alt="">
  </div>

  <div class="lightbox" id="lightbox">
    <button class="lb-close" id="lbClose" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <button class="lb-prev" id="lbPrev" aria-label="Previous">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <img id="lbImg" src="" alt="">
    <button class="lb-next" id="lbNext" aria-label="Next">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
    </button>
    <div class="lb-counter" id="lbCounter"></div>
  </div>

<script>
  /* ============================================================
     PHOTO DATA
     Photos are loaded from content/photos.json, which is managed
     through the CMS at /admin — no code editing needed to add,
     remove, or recategorize photos going forward.
     ============================================================ */
  const FALLBACK_PHOTOS = [
    { category:'portraits', image:'images/photography/portrait-1.jpg', alt:'Portrait' },
    { category:'portraits', image:'images/photography/portrait-2.jpg', alt:'Portrait' },
    { category:'portraits', image:'images/photography/portrait-3.jpg', alt:'Portrait' },
    { category:'portraits', image:'images/photography/portrait-4.jpg', alt:'Portrait' },
  ];

  let photos = [];

  const gallery = document.getElementById('gallery');
  const emptyState = document.getElementById('emptyState');
  const filterButtons = document.querySelectorAll('.filter-btn');
  const isHoverCapable = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

  const scrim = document.getElementById('scrim');
  const hoverPreview = document.getElementById('hoverPreview');
  const hoverImg = document.getElementById('hoverImg');

  async function loadPhotos(){
    try {
      const res = await fetch('content/photos.json', { cache: 'no-store' });
      if (!res.ok) throw new Error('no data file');
      const data = await res.json();
      photos = (data.photos || []).map(p => ({
        category: p.category,
        thumb: p.image.replace(/^\//, ''),
        full: p.image.replace(/^\//, ''),
        alt: p.alt || 'Photo'
      }));
      if (photos.length === 0) photos = FALLBACK_PHOTOS;
    } catch (e) {
      photos = FALLBACK_PHOTOS;
    }
    buildTiles();
    applyFilter('all');
  }

  // Build tiles
  function buildTiles(){
    gallery.querySelectorAll('.tile').forEach(t => t.remove());
    photos.forEach((p, i) => {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.dataset.category = p.category;
      tile.dataset.index = i;
      tile.innerHTML = `<img src="${p.thumb}" alt="${p.alt}" loading="lazy">`;

      if (isHoverCapable) {
        tile.addEventListener('mouseenter', () => showHoverPreview(tile, p));
        tile.addEventListener('mouseleave', hideHoverPreview);
      }
      tile.addEventListener('click', () => openLightbox(i));

      gallery.insertBefore(tile, emptyState);
    });
  }

  // (filter counts intentionally not shown — icon-only, no text labels)

  function applyFilter(cat){
    const tiles = document.querySelectorAll('.tile');
    let visibleCount = 0;
    tiles.forEach(t => {
      const show = (cat === 'all') || (t.dataset.category === cat);
      t.classList.toggle('hidden', !show);
      if (show) visibleCount++;
    });
    emptyState.classList.toggle('visible', visibleCount === 0);
  }

  filterButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      filterButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      applyFilter(btn.dataset.filter);
    });
  });

  loadPhotos();

  // Hover preview (desktop only) — dims the whole gallery, floats the full image centered
  let hoverTimeout = null;

  function showHoverPreview(tile, p){
    clearTimeout(hoverTimeout);
    document.querySelectorAll('.tile').forEach(t => t.classList.remove('is-hovered'));
    tile.classList.add('is-hovered');
    gallery.classList.add('has-hover');
    hoverImg.src = p.full;
    hoverImg.alt = p.alt;
    scrim.classList.add('active');
    hoverPreview.classList.add('active');
  }

  function hideHoverPreview(){
    hoverTimeout = setTimeout(() => {
      gallery.classList.remove('has-hover');
      document.querySelectorAll('.tile').forEach(t => t.classList.remove('is-hovered'));
      scrim.classList.remove('active');
      hoverPreview.classList.remove('active');
    }, 60);
  }

  // Lightbox (click to pin open, works on all devices, has prev/next)
  const lightbox = document.getElementById('lightbox');
  const lbImg = document.getElementById('lbImg');
  const lbCounter = document.getElementById('lbCounter');
  let currentIndex = 0;

  function getVisiblePhotoIndices(){
    const activeCat = document.querySelector('.filter-btn.active').dataset.filter;
    return photos
      .map((p, i) => ({ p, i }))
      .filter(({p}) => activeCat === 'all' || p.category === activeCat)
      .map(({i}) => i);
  }

  function openLightbox(index){
    hideHoverPreview();
    scrim.classList.remove('active');
    hoverPreview.classList.remove('active');
    currentIndex = index;
    renderLightbox();
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox(){
    lightbox.classList.remove('open');
    document.body.style.overflow = '';
  }

  function renderLightbox(){
    const p = photos[currentIndex];
    lbImg.src = p.full;
    lbImg.alt = p.alt;
    const visible = getVisiblePhotoIndices();
    const pos = visible.indexOf(currentIndex) + 1;
    lbCounter.textContent = `${pos} / ${visible.length}`;
  }

  function step(dir){
    const visible = getVisiblePhotoIndices();
    const pos = visible.indexOf(currentIndex);
    const nextPos = (pos + dir + visible.length) % visible.length;
    currentIndex = visible[nextPos];
    renderLightbox();
  }

  document.getElementById('lbClose').addEventListener('click', closeLightbox);
  document.getElementById('lbPrev').addEventListener('click', (e) => { e.stopPropagation(); step(-1); });
  document.getElementById('lbNext').addEventListener('click', (e) => { e.stopPropagation(); step(1); });
  lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });

  document.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
  });
</script>

</body>
</html>
