<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asad Jaleel</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="favicon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png">
<style>
  :root{
    --bg:#faf7f2;
    --ink:#201e1a;
    --ink-dim:#726c62;
    --hairline:rgba(32,30,26,0.14);
    --ease:cubic-bezier(.65,0,.35,1);
    --mono:'Courier New', Courier, monospace;

    /* Marquee geometry: 3 items in frame */
    --item:33.3333vw;
    --set:calc(var(--item) * 3);
    --speed:42s;
  }

  *{box-sizing:border-box;margin:0;padding:0;}

  html,body{
    height:100%;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--mono);
    overflow:hidden;
  }
  a{color:inherit;text-decoration:none;}
  ::selection{background:var(--ink);color:var(--bg);}

  .page{ height:100vh; }

  /* Scrims keep the overlaid header/footer legible over any photo */
  .page::before,
  .page::after{
    content:"";
    position:fixed;
    left:0;right:0;
    height:170px;
    z-index:5;
    pointer-events:none;
  }
  .page::before{
    top:0;
    background:linear-gradient(180deg, rgba(250,247,242,.92) 0%, rgba(250,247,242,0) 100%);
  }
  .page::after{
    bottom:0;
    background:linear-gradient(0deg, rgba(250,247,242,.92) 0%, rgba(250,247,242,0) 100%);
  }

  /* ===== Header ===== */
  header{
    position:fixed;
    top:0;left:0;right:0;
    padding:26px 30px;
    z-index:10;
  }
  .name{
    font-family:var(--mono);
    font-weight:500;
    font-size:14px;
    letter-spacing:.16em;
    text-transform:uppercase;
  }

  /* ===== Marquee ===== */
  .viewport{
    position:fixed;
    inset:0;
    overflow:hidden;
    display:flex;
    align-items:stretch;
  }

  .track{
    display:flex;
    width:max-content;
    will-change:transform;
    touch-action:pan-y;
  }

  .item{
    width:var(--item);
    flex:0 0 var(--item);
  }

  .card{
    position:relative;
    display:block;
    width:100%;
    height:100vh;
    overflow:hidden;
    background:#efece4;
    border-right:1px solid rgba(250,247,242,.55);
  }
  .card img{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:cover;
    object-position:center;
    filter:grayscale(100%) brightness(1.02) contrast(.96);
    transform:scale(1.03);
    transition:filter .7s var(--ease), transform 1.1s var(--ease);
  }
  .card:hover img{
    filter:grayscale(0%) brightness(1) contrast(1.02);
    transform:scale(1.07);
  }

  /* Other cards recede while one is hovered */
  .viewport:hover .item{ transition:opacity .5s var(--ease); opacity:.42; }
  .viewport .item:hover{ opacity:1; }

  /* Scramble label */
  .label{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:row;
    align-items:center;
    justify-content:center;
    gap:16px;
    padding:20px;
    background:rgba(250,247,242,.34);
    backdrop-filter:blur(1.5px);
    opacity:0;
    transition:opacity .45s var(--ease);
  }
  .card:hover .label{ opacity:1; }

  .label .txt{
    writing-mode:vertical-rl;
    text-orientation:mixed;
    transform:rotate(180deg);
    font-family:var(--mono);
    font-size:clamp(11px,.95vw,16px);
    letter-spacing:.24em;
    text-transform:uppercase;
    white-space:nowrap;
  }
  .label .idx{
    writing-mode:vertical-rl;
    text-orientation:mixed;
    transform:rotate(180deg);
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.2em;
    color:var(--ink-dim);
  }

  /* ===== Footer ===== */
  footer{
    position:fixed;
    bottom:0;left:0;right:0;
    display:flex;
    justify-content:flex-end;
    align-items:center;
    gap:20px;
    padding:22px 30px 28px;
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink-dim);
    z-index:10;
  }
  footer a{ transition:color .25s var(--ease); }
  footer a:hover{ color:var(--ink); }
  .footer-links{ display:flex; gap:22px; }

  /* ===== Responsive ===== */
  @media (max-width:1000px){
    :root{ --item:46vw; --speed:34s; }
  }
  @media (max-width:640px){
    :root{ --item:74vw; --speed:26s; }
    footer{ padding:18px 20px 22px; }

    /* No hover on touch. Every card keeps a quiet label so you always
       know what you're looking at; the card under your finger gets the
       full reveal — colour, veil, and the scramble animation. */
    .label{
      opacity:.55;
      background:transparent;
      backdrop-filter:none;
    }
    .card.is-active .label{
      opacity:1;
      background:rgba(250,247,242,.34);
      backdrop-filter:blur(1.5px);
    }
    .card.is-active img{
      filter:grayscale(0%) brightness(1) contrast(1.02);
      transform:scale(1.06);
    }
    .viewport:hover .item{ opacity:1; }
  }

  @media (prefers-reduced-motion:reduce){
    .viewport{ overflow-x:auto; }
    .card img{ transition:none; }
  }
</style>
</head>
<body>

<div class="page">

  <header>
    <span class="name">Asad Jaleel</span>
  </header>

  <div class="viewport">
    <div class="track" id="track">
      <!-- Sets are cloned by JS for a seamless loop -->
      <div class="item">
        <a class="card" href="/professional" data-name="Professional" data-idx="01">
          <img src="images/professional.jpg" alt="" onerror="this.style.display='none'">
          <span class="label"><span class="txt">Professional</span><span class="idx">01</span></span>
        </a>
      </div>
      <div class="item">
        <a class="card" href="/photography" data-name="Photography" data-idx="02">
          <img src="images/photography.jpg" alt="" onerror="this.style.display='none'">
          <span class="label"><span class="txt">Photography</span><span class="idx">02</span></span>
        </a>
      </div>
      <div class="item">
        <a class="card" href="/personal" data-name="Personal" data-idx="03">
          <img src="images/personal.jpg" alt="" onerror="this.style.display='none'">
          <span class="label"><span class="txt">Personal</span><span class="idx">03</span></span>
        </a>
      </div>
    </div>
  </div>

  <footer>
    <div class="footer-links">
      <a href="mailto:hello@asadjaleel.com">Email</a>
      <a href="#">LinkedIn</a>
      <a href="#">Instagram</a>
    </div>
  </footer>

</div>

<script>
(function(){
  const track = document.getElementById('track');
  const viewport = document.querySelector('.viewport');

  /* --- Seamless loop: clone the original set until we have 4 copies,
         so there's always material off-screen in both directions. --- */
  const originals = Array.from(track.children);
  const SETS = 4;
  for (let i = 0; i < SETS - 1; i++){
    originals.forEach(node => track.appendChild(node.cloneNode(true)));
  }

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ================= Marquee engine =================
     Driven in JS rather than CSS so a swipe can interrupt it
     and it can pick back up from wherever the finger left off. */
  let setWidth = 0;
  let offset = 0;          // current x translation (negative = moved left)
  let autoSpeed = 0;       // px per second, negative
  let momentum = 0;        // px per second from a flick, decays to 0
  let paused = false;      // desktop hover
  let dragging = false;
  let lastT = 0;

  function measure(){
    const total = track.scrollWidth;
    setWidth = total / SETS;
    // Derive speed from the --speed CSS var so timing stays tunable in CSS.
    const dur = parseFloat(getComputedStyle(document.documentElement)
                  .getPropertyValue('--speed')) || 42;
    autoSpeed = -setWidth / dur;
    // Start one set in, so there's room to swipe backwards immediately.
    if (offset === 0) offset = -setWidth;
  }

  function wrap(){
    if (!setWidth) return;
    // Keep offset within [-2*setWidth, 0) — visually identical, never runs out.
    while (offset <= -setWidth * 2) offset += setWidth;
    while (offset > -setWidth) offset -= setWidth;
  }

  function frame(t){
    if (!lastT) lastT = t;
    const dt = Math.min((t - lastT) / 1000, 0.05); // clamp after tab-switches
    lastT = t;

    if (!dragging){
      if (Math.abs(momentum) > 1){
        offset += momentum * dt;
        momentum *= Math.pow(0.12, dt); // exponential decay, framerate-independent
      } else {
        momentum = 0;
      }
      if (!paused) offset += autoSpeed * dt;
    }

    wrap();
    track.style.transform = 'translate3d(' + offset + 'px,0,0)';
    requestAnimationFrame(frame);
  }

  measure();
  window.addEventListener('resize', () => { measure(); });

  if (!reduceMotion){
    requestAnimationFrame(frame);
  } else {
    track.style.transform = 'translate3d(' + (-setWidth) + 'px,0,0)';
  }

  /* Desktop: hovering pauses the drift so links are clickable. */
  viewport.addEventListener('mouseenter', () => { paused = true; });
  viewport.addEventListener('mouseleave', () => { paused = false; });

  /* ================= Touch swipe =================
     Drag to move, release to resume. A flick carries momentum
     that decays back into the normal drift. */
  let startX = 0, startOffset = 0, moved = 0;
  let samples = [];
  let activeCard = null;

  /* Whichever card sits under the finger becomes the active one and
     plays its scramble reveal — the touch equivalent of hovering. */
  function activateAt(x, y){
    const el = document.elementFromPoint(x, y);
    const card = el && el.closest ? el.closest('.card') : null;
    if (!card || card === activeCard) return;

    if (activeCard) activeCard.classList.remove('is-active');
    activeCard = card;
    card.classList.add('is-active');

    const txt = card.querySelector('.txt');
    if (txt) scramble(txt, card.dataset.name);
  }

  viewport.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) return;
    dragging = true;
    momentum = 0;
    moved = 0;
    startX = e.touches[0].clientX;
    startOffset = offset;
    samples = [{ x: startX, t: performance.now() }];
    activateAt(startX, e.touches[0].clientY);
  }, { passive: true });

  viewport.addEventListener('touchmove', (e) => {
    if (!dragging || e.touches.length !== 1) return;
    const x = e.touches[0].clientX;
    const y = e.touches[0].clientY;
    const dx = x - startX;
    moved = Math.abs(dx);

    if (moved > 6) e.preventDefault();   // it's a horizontal swipe, not a tap

    offset = startOffset + dx;
    wrap();
    track.style.transform = 'translate3d(' + offset + 'px,0,0)';

    // Follow the finger across cards as the strip slides under it.
    activateAt(x, y);

    const now = performance.now();
    samples.push({ x, t: now });
    if (samples.length > 6) samples.shift();
  }, { passive: false });

  function endDrag(){
    if (!dragging) return;
    dragging = false;

    // Velocity from the last ~100ms of movement.
    const now = performance.now();
    const recent = samples.filter(s => now - s.t < 140);
    if (recent.length >= 2){
      const a = recent[0], b = recent[recent.length - 1];
      const dt = (b.t - a.t) / 1000;
      if (dt > 0) momentum = Math.max(-4000, Math.min(4000, (b.x - a.x) / dt));
    }
    samples = [];
  }

  viewport.addEventListener('touchend', endDrag, { passive: true });
  viewport.addEventListener('touchcancel', endDrag, { passive: true });

  /* A swipe shouldn't also count as tapping the link underneath. */
  track.addEventListener('click', (e) => {
    if (moved > 8){
      e.preventDefault();
      e.stopPropagation();
      moved = 0;
    }
  }, true);

  /* --- Scramble reveal --- */
  const GLYPHS = '§±#@%&$*<>/\\[]{}=+~^ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  const running = new WeakMap();

  function scramble(el, finalText){
    const prev = running.get(el);
    if (prev) cancelAnimationFrame(prev.raf);

    const len = finalText.length;
    // Each character locks in after its own delay, left to right.
    const schedule = Array.from({length: len}, (_, i) => ({
      start: i * 2,
      end: i * 2 + 8 + Math.floor(Math.random() * 8)
    }));

    let frame = 0;
    el.classList.add('scrambling');

    const state = {};
    state.raf = requestAnimationFrame(function step(){
      let out = '';
      let done = 0;

      for (let i = 0; i < len; i++){
        const ch = finalText[i];
        if (ch === ' '){ out += ' '; done++; continue; }

        const s = schedule[i];
        if (frame >= s.end){
          out += ch;
          done++;
        } else if (frame >= s.start){
          out += GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
        } else {
          out += GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
        }
      }

      el.textContent = out;
      frame++;

      if (done === len){
        el.classList.remove('scrambling');
        el.textContent = finalText;
        running.delete(el);
        return;
      }
      state.raf = requestAnimationFrame(step);
    });

    running.set(el, state);
  }

  /* Bind to every card, including the clones. */
  track.querySelectorAll('.card').forEach(card => {
    const txt = card.querySelector('.txt');
    const finalText = card.dataset.name;

    card.addEventListener('mouseenter', () => scramble(txt, finalText));
    card.addEventListener('focus', () => scramble(txt, finalText));
    card.addEventListener('mouseleave', () => {
      const s = running.get(txt);
      if (s) cancelAnimationFrame(s.raf);
      running.delete(txt);
      txt.classList.remove('scrambling');
      txt.textContent = finalText;
    });
  });
})();
</script>

</body>
</html>
