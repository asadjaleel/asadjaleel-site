backend:
  name: git-gateway
  branch: main

# Where uploaded photos get stored in the repo, and the public path used to reference them
media_folder: "images/photography/uploads"
public_folder: "/images/photography/uploads"

collections:
  - name: "music"
    label: "Music"
    files:
      - name: "playlist"
        label: "Playlist"
        file: "content/playlist.json"
        fields:
          - label: "Tracks"
            name: "tracks"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - label: "Title"
                name: "title"
                widget: "string"
              - label: "Audio file"
                name: "file"
                widget: "file"
                media_folder: "/audio/uploads"
                public_folder: "/audio/uploads"

  - name: "homepage"
    label: "Homepage"
    files:
      - name: "hero-images"
        label: "Hero Images"
        file: "content/homepage.json"
        media_folder: "/images/uploads"
        public_folder: "/images/uploads"
        fields:
          - label: "Professional section photo"
            name: "professional"
            widget: "image"
          - label: "Photography section photo"
            name: "photography"
            widget: "image"
          - label: "Personal section photo"
            name: "personal"
            widget: "image"

  - name: "photos"
    label: "Photography"
    files:
      - name: "gallery"
        label: "Gallery"
        file: "content/photos.json"
        fields:
          - label: "Photos"
            name: "photos"
            widget: "list"
            summary: "{{fields.category}} — {{fields.alt}}"
            fields:
              - label: "Category"
                name: "category"
                widget: "select"
                options:
                  - { label: "Portraits", value: "portraits" }
                  - { label: "Landscapes", value: "landscapes" }
                  - { label: "Street", value: "street" }
              - label: "Photo"
                name: "image"
                widget: "image"
              - label: "Description (for accessibility, not shown on page)"
                name: "alt"
                widget: "string"
                required: false
                default: "Photo"
